<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>조건에 맞는 단지 찾기</title>
<style>
/* kit:start — 빅밸류 리포트 키트 v1. 진단·비교·찾기 템플릿에서 이 구간은 글자 하나까지 같다. */
:root{
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --bg:#eef1f5;--panel:#fff;--ink:#141a24;--sub:#5a6572;--faint:#6f7985;
  --line:#e2e6ec;--zebra:#f6f8fa;--chip:#f1f4f8;
  --accent:#2f6bed;--accent-s:#e6eefe;
  --real:#2f6bed;--ai:#12a594;--notice:#c98a12;
  --t1:#2f6bed;--t2:#7fa3f4;--t3:#bccff9;--t4:#dfe7fb;
  --gold:#b87d0c;--gold-s:#f9efd6;
  --good:#0b8a60;--good-s:#e2f5ed;--warn:#a96f0a;--warn-s:#faf0d9;--bad:#cc2a2a;--bad-s:#fde8e8;
  --shadow:0 1px 2px rgba(20,26,36,.04),0 10px 30px rgba(20,26,36,.06);
}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f14;--panel:#161b22;--ink:#e8ecf1;--sub:#9aa4b0;--faint:#7f8995;
  --line:#262d37;--zebra:#1c222a;--chip:#1e242d;
  --accent:#6b9bff;--accent-s:#1a2740;
  --real:#6b9bff;--ai:#3cc9b6;--notice:#e0af4b;
  --t1:#6b9bff;--t2:#4a73c4;--t3:#2f4a80;--t4:#22324f;
  --gold:#e5b53b;--gold-s:#2c2410;
  --good:#3ddc97;--good-s:#10301f;--warn:#e5b84b;--warn-s:#332a12;--bad:#ff7a7a;--bad-s:#3a1717;
  --shadow:none;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);word-break:keep-all;overflow-wrap:anywhere}
[hidden]{display:none!important}
b{color:var(--ink);font-weight:800}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--accent)}
h1{margin-top:7px;font-size:27px;font-weight:850;line-height:1.3;letter-spacing:-.03em;text-wrap:balance}
.lede{margin-top:10px;max-width:66ch;color:var(--sub)}
.verdict{margin-top:22px;padding:20px 22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.verdict-top{display:flex;align-items:center;gap:8px}
.verdict-top .label{font-size:12px;font-weight:800;color:var(--accent)}
.verdict h2{margin-top:8px;font-size:20px;font-weight:820;line-height:1.45;letter-spacing:-.025em;text-wrap:balance}
.verdict p{margin-top:8px;color:var(--sub)}
.badge{display:inline-flex;align-items:center;padding:1.5px 7px;border-radius:6px;font-size:11px;font-weight:800;line-height:1.5;
  white-space:nowrap;vertical-align:1px;color:var(--sub);background:var(--chip)}
.badge.info{color:var(--accent);background:var(--accent-s)}
.badge.good{color:var(--good);background:var(--good-s)}
.badge.warn{color:var(--warn);background:var(--warn-s)}
.badge.bad{color:var(--bad);background:var(--bad-s)}
.sec{margin-top:34px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;margin-bottom:12px}
.sec-h .n{font-size:12px;font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.sec-h h2{font-size:18.5px;font-weight:800;letter-spacing:-.02em}
.sec-h .sub{margin-left:auto;font-size:12.5px;color:var(--faint)}
.intro{max-width:70ch;margin:-4px 0 12px;color:var(--sub);font-size:14px}
.panel{padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sec>*+*:not(.sec-h):not(.intro){margin-top:10px}
.note{padding:9px 12px;border-radius:9px;background:var(--zebra);color:var(--sub);font-size:12.5px;line-height:1.55}
.panel .note{margin-top:12px}
.cap{margin-bottom:10px;font-size:12px;color:var(--faint)}
/* 숫자 타일 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{min-width:0;padding:14px 15px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;font-weight:700;color:var(--faint)}
.kpi .v{margin-top:4px;font-size:22px;font-weight:850;line-height:1.3;letter-spacing:-.02em}
.kpi .v small{margin-left:2px;font-size:13px;font-weight:700;color:var(--sub)}
.kpi .d{margin-top:3px;font-size:11.5px;color:var(--sub)}
/* 속성 칩과 항목 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border-radius:7px;background:var(--chip);color:var(--sub);font-size:12px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0 20px}
.fact{min-width:0;padding:10px 0;border-top:1px solid var(--line)}
.fact dt{font-size:12px;font-weight:600;color:var(--faint)}
.fact dd{margin-top:2px;font-weight:750}
.fact dd small{display:block;font-size:11.5px;font-weight:500;color:var(--faint)}
/* 공통 축 막대 */
.bars{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr) auto;gap:9px 12px;align-items:center}
.bar{display:grid;grid-column:1/-1;grid-template-columns:subgrid;align-items:center}
.bar-l{min-width:0;font-size:13px;font-weight:700;line-height:1.35}
.bar-l small{display:block;font-size:11px;font-weight:600;color:var(--faint)}
.bar-l .badge{margin-left:5px}
.rk{display:inline-block;min-width:16px;margin-right:6px;font-weight:850;color:var(--faint);font-variant-numeric:tabular-nums}
.rk.top{color:var(--gold)}
.bar-l.ranked small{padding-left:22px}
.dot{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:3px;vertical-align:0}
.track{height:20px;border-radius:6px;background:var(--zebra);overflow:hidden}
.track.na,.comp-bar.na{background:repeating-linear-gradient(135deg,var(--zebra) 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 1px var(--line)}
.fill{height:100%;border-radius:6px;background:var(--accent)}
.bar.dim .fill{opacity:.35}
.bar-v{font-size:13px;font-weight:800;text-align:right;white-space:nowrap}
.bar-v small{margin-left:4px;font-size:11px;font-weight:600;color:var(--faint)}
.bar-v.na{color:var(--faint);font-weight:700}
/* 가격 세 축 카드 */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.lg{display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:var(--sub)}
.lg small{margin-left:5px;font-size:12px;font-weight:600;color:var(--faint)}
.pcard{padding:18px 18px 16px;border-radius:18px}
.pcard-top{display:flex;align-items:flex-start;gap:12px}
.medal{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;
  background:var(--zebra);color:var(--faint);font-weight:850}
.medal.top{background:var(--gold-s);color:var(--gold)}
.pcard-t{flex:1 1 auto;min-width:0}
.pcard-t h3{font-size:18px;font-weight:820;letter-spacing:-.02em}
.pcard-t h3 .badge{margin-left:7px}
.pcard-t p{margin-top:2px;font-size:12.5px;color:var(--faint)}
.aside{flex:0 0 auto;text-align:right}
.aside small{display:block;font-size:10.5px;font-weight:700;color:var(--faint)}
.aside strong{font-size:17px;font-weight:850;letter-spacing:-.02em;color:var(--accent);white-space:nowrap}
.pcard .chips{margin-top:13px}
.band{margin-top:15px;font-size:12.5px;font-weight:700;color:var(--sub)}
.pcard .bars{margin-top:14px}
.pcard .band+.bars{margin-top:8px}
.pcard .bars{grid-template-columns:76px minmax(0,1fr) 8.5em}
.pcard .bar-v{white-space:normal}
.pcard .bar-v small{display:block;margin-left:0}
/* 월별 막대 */
.cols{display:flex;align-items:stretch;gap:6px;height:190px;overflow-x:auto;padding-bottom:2px}
.col{flex:1 0 22px;display:flex;flex-direction:column;min-width:22px}
.plot{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-top:18px;border-bottom:1px solid var(--line)}
.colbar{position:relative;flex:0 0 auto;width:100%;max-width:38px}
.col-v{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:2px;font-size:11px;font-weight:800;line-height:1.4;white-space:nowrap;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column-reverse;width:100%;height:100%;border-radius:5px 5px 0 0;overflow:hidden}
.seg{width:100%}
.col.partial .stack{opacity:.45}
.col.partial .stack::after,.sw.partial{background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 5px)}
.col.partial .stack{position:relative}
.col.partial .stack::after{content:"";position:absolute;inset:0}
.col-l{margin-top:6px;font-size:11px;color:var(--faint);text-align:center;white-space:nowrap}
.cols.dense .col:not(:nth-child(3n+1)) .col-l{visibility:hidden}
.sw{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:3px}
.panel .legend{margin-bottom:12px}
/* 구성비 막대 */
.comp+.comp{margin-top:16px}
.comp-h{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:13px;font-weight:750}
.comp-h small{font-size:12px;font-weight:600;color:var(--faint)}
.comp-bar{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;background:var(--zebra)}
.comp-v{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:12px;color:var(--sub)}
/* 표 */
.table-wrap{max-height:40rem;overflow:auto;padding:0;border-radius:16px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
caption{padding:12px 16px 4px;text-align:left;font-size:12.5px;color:var(--faint)}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line);overflow-wrap:normal}
thead th{position:sticky;top:0;z-index:1;background:var(--panel);border-top:0;border-bottom:1px solid var(--line);
  color:var(--faint);font-size:11.5px;font-weight:700;white-space:nowrap}
thead+tbody tr:first-child>*{border-top:0}
td{min-width:7.5em}
tbody th{min-width:130px;font-weight:750}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small,th small{display:block;margin-top:2px;font-size:11.5px;font-weight:500;color:var(--faint);white-space:normal}
td .badge,th .badge{margin-right:5px}
.empty{color:var(--faint);font-size:13.5px}
/* 후보 카드 */
.item{border-radius:16px}
.item+.item{margin-top:10px}
.item-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.item-h h3{font-size:17px;font-weight:820;letter-spacing:-.02em}
.kicker{margin-bottom:2px;font-size:12px;color:var(--faint)}
.item>p{margin-top:4px;color:var(--sub);font-size:14px}
.item .chips{margin-top:11px}
.checks{margin-top:12px;list-style:none}
.check{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:start;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.check strong{font-weight:750}
.check span{color:var(--sub)}
.check small{display:block;font-size:12px;color:var(--faint)}
/* 조건 목록 */
.crit{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0;padding-top:0}
.crit:last-child{padding-bottom:0}
.crit>span{padding-top:1px;font-size:12px;font-weight:800;color:var(--accent)}
.crit>span.preference{color:var(--faint)}
.crit>span.exclude{color:var(--bad)}
.crit strong{font-weight:750}
.crit p{font-size:13.5px;color:var(--sub)}
/* 읽는 법과 출처 */
.notes{list-style:none}
.notes li{position:relative;padding-left:13px;margin-bottom:7px;color:var(--sub);font-size:13px}
.notes li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
.foot p+p{margin-top:3px}
.sec-h+.foot{margin-top:0;padding-top:0;border-top:0}
.foot strong{color:var(--sub);font-weight:700}
.fallback{margin-top:22px}
@media (max-width:640px){
  h1{font-size:23px}.verdict{padding:18px}.verdict h2{font-size:18.5px}
  .bars{display:flex;flex-direction:column;align-items:stretch;gap:12px}
  .bar{grid-template-columns:minmax(0,1fr) auto;gap:5px 10px}
  .bar .track{grid-column:1/-1;grid-row:2}
  .pcard-top{flex-wrap:wrap}
  .aside{flex-basis:100%;display:flex;align-items:baseline;gap:6px;text-align:left}
  .cols{gap:4px}
  .cols:has(.col:nth-child(9)) .col:nth-child(even) .col-l{visibility:hidden}
  th,td{padding:10px 12px}
}
@media (forced-colors:active){.fill,.seg,.sw,.dot,.badge{forced-color-adjust:none}}
@media print{
  :root{--bg:#fff;--panel:#fff;--shadow:none}
  body{font-size:10.5pt}
  .wrap{max-width:none;padding:0}
  .sec-h,.intro{break-after:avoid}
  .panel,.kpi,.item,.pcard,tr,.bar,.comp{break-inside:avoid}
  .table-wrap{max-height:none;overflow:visible}
  .cols{overflow:visible}
  thead th{position:static}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* kit:end */
</style>
<style id="theme">
/* 요청이 있을 때만 채운다. :root의 색·글꼴 토큰(--accent, --font, --bg …)을 덮어쓰면 리포트 전체 톤이 바뀐다.
   다크 화면까지 바꾸려면 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){…}} 안에서도 덮어쓴다.
   가격 세 축(--real·--ai·--notice)은 서로 구분되는 색으로 둔다. */
</style>
</head>
<body>
<main class="wrap" id="report">
  <noscript><p class="panel fallback">이 리포트를 보려면 JavaScript가 필요합니다. 텍스트 리포트가 필요하면 작성자에게 요청하세요.</p></noscript>
</main>

<!--
  단지 찾기 리포트 기본 디자인. 데이터 블록에는 실제 조회·판정 결과만 넣는다. API 호출이나 키는 넣지 않는다.
  쓰는 법: 기본 디자인으로 충분하면 파일을 복사해 report-data만 채운다. 톤만 바꾸려면 theme 블록에서
  토큰을 덮어쓴다. 질문에 더 맞는 배치·차트가 있으면 마크업·스타일·부품을 바꾸거나 새로 그려도 된다.
  어떤 경우든 SKILL.md '리포트 표현'의 표기 규칙은 지킨다.

  넣는 법: JSON을 직렬화한 뒤 모든 < 를 \u003c 로 바꿔 아래 script 안에 넣는다.
  문자열은 텍스트로만 그린다. HTML은 쓰지 않으며 **굵게** 표시만 지원한다.

  최상위: title, lede, verdict, sections[], criteria[], coverage, notes[], sources[], reference, generatedAt
    lede: 지역·유형·시점·핵심 조건을 짧게.
    verdict: {label?, headline, summary?, state?: "partial"|"unavailable"}
      headline은 후보 수와 핵심 결과, 후보가 없으면 없음 또는 판단 보류의 이유다.
      state는 조회 범위 상태이며 후보의 조건 충족 여부가 아니다. 전체를 확인했으면 비운다.
    criteria: [{kind: "required"|"preference"|"exclude", label, description?, note?}] → '적용한 조건'으로 그린다.
    coverage: {summary?, facts:[{label, value, note?}]} → '알아둘 점'으로 그린다. 조회 범위·제외 처리의 상세다.
    sources: [{name, reference?, note?}] 출처와 기준시점.

  sections[]: {title, sub?(오른쪽 작은 글씨, 기준시점·범위), intro?, note?, 그리고 아래 부품 중 필요한 것}
    부품                          쓰는 곳
    kpis   [{label, value, unit?, note?}]           지역 규모처럼 대표 숫자 2~5개
    chips  ["**1,928**세대", ...]                    단지 속성 나열
    facts  [{label, value, note?}]                  이름·거리·학교처럼 값이 글인 항목
    bars   {caption?, series?, rows:[{label, value, display, sub?, note?, rank?, tag?, highlight?}]}
                                                    같은 단위 값을 한 축에 놓는 비교
    prices {basis:{real?, ai?, notice?}, items:[{name, rank?, sub?, badge?(글 또는 tag), aside?:{label, value}, chips?, band?, real?, ai?, notice?, note?}]}
                                                    실거래·산출시세·공시가격을 나란히. 축마다 {value, display, note?}
    series {legend?:[이름], rows:[{label, values:[n...], display?, partial?}], partialNote?}
                                                    월별 거래 건수처럼 기간 순서가 있는 값
    composition {rows:[{label, parts:[{label, value, display?}]}]}
                                                    아파트·오피스텔·연립다세대처럼 합이 전체인 구성
    table  {caption?, columns:[이름 | {label, numeric:true}], rows:[[셀 | {value, note?, status?}]], emptyMessage?}
                                                    후보 × 조건 판정표. 첫 열은 단지 이름이다
    items  [{name, kicker?, status?, summary?, chips?, checks:[{label, status, value?, note?}]}]
                                                    근거가 복잡한 후보 몇 곳의 조건별 판정 카드

  기본 부품을 쓸 때의 조합 예 (질문에 필요한 것만 쓴다):
    후보가 적고 근거가 복잡함  → items. chips에 핵심 실제 값, checks에 조건별 판정
    후보가 많음               → table. 조건 열 셀에 status를 붙인다
    한 수치로 후보를 늘어놓음   → bars. 사용자가 정한 정렬 기준이 있을 때만 rank를 쓴다
    선별 흐름                 → bars(지역 단지 → 단지 조건 통과 → 상세 확인 → 충족 건수)

  부품 규칙:
    - sections는 후보와 근거부터 놓는다. criteria와 coverage는 '적용한 조건'·'알아둘 점'으로 자동으로 뒤에 붙는다.
    - 결과를 바꾸는 조회 한계(일부 페이지, 모집단 한정, 미확인 조건)는 해당 결과 섹션의 note에 둔다.
    - table 행과 열은 개수가 맞아야 하고 첫 열은 단지 이름이다. 주소는 셀 note에 둔다.
    - 막대 길이는 value 숫자의 실제 비례이고 글자는 display 그대로다. 금액 display는 원값에서 만든 같은 표기를 쓴다.
    - value가 null이면 '확인 불가'로 그린다. bars·series는 0 이상 값만 그린다.
    - tag는 {text, tone: "info"|"good"|"warn"|"bad"}, status는 "pass"|"fail"|"unknown"이다.
-->
<script type="application/json" id="report-data">
{
  "title": "",
  "lede": "",
  "verdict": {"label": "찾은 결과", "headline": "", "summary": "", "state": ""},
  "sections": [],
  "criteria": [],
  "coverage": {"summary": "", "facts": []},
  "notes": [],
  "sources": [],
  "reference": "",
  "generatedAt": ""
}
</script>

<script>
/* kit:start — 빅밸류 리포트 키트 v1 렌더러. 데이터 문자열은 textContent로만 넣는다. */
const Kit = (() => {
  "use strict";
  const list = v => Array.isArray(v) ? v : [];
  const rec = v => v !== null && typeof v === "object" && !Array.isArray(v) ? v : {};
  const str = v => v == null ? "" : String(v);
  const isNum = v => typeof v === "number" && Number.isFinite(v);
  const NA = "확인 불가";
  const SERIES = {real: ["실거래가", "var(--real)", "실거래"], ai: ["AI 산출시세", "var(--ai)", "AI 시세"], notice: ["공시가격", "var(--notice)", "공시가격"]};
  const STATUS = {pass: ["충족", "good"], fail: ["미충족", "bad"], unknown: ["확인 불가", "warn"],
    partial: ["일부 범위 확인", "warn"], unavailable: ["조회 불가", "bad"]};
  const TONES = ["info", "good", "warn", "bad"];
  const RAMP = ["var(--t1)", "var(--t2)", "var(--t3)", "var(--t4)"];

  function rich(node, value) {
    str(value).split(/\*\*(.+?)\*\*/).forEach((part, i) => {
      if (!part) return;
      if (i % 2) { const b = document.createElement("b"); b.textContent = part; node.append(b); }
      else node.append(part);
    });
    return node;
  }
  function el(tag, cls, value) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (value != null && value !== "") rich(node, value);
    return node;
  }
  const shown = (value, display) => display != null && display !== "" ? str(display)
    : isNum(value) ? value.toLocaleString("ko-KR") : value == null || value === "" ? NA : str(value);
  const badge = status => { const s = STATUS[status] || STATUS.unknown; return el("span", "badge " + s[1], s[0]); };
  const tag = t => { t = rec(t); return el("span", "badge " + (TONES.includes(t.tone) ? t.tone : ""), t.text); };
  const swatch = (color, cls) => { const s = el("span", "sw" + (cls ? " " + cls : "")); if (color) s.style.background = color; return s; };
  const maxOf = values => Math.max(0, ...values.filter(isNum));
  // 실제 비례 그대로 그린다. 0보다 큰 값이 안 보일 만큼 작을 때만 2px를 보장한다.
  const size = (v, max) => isNum(v) && v > 0 && max > 0 ? "max(2px, " + v / max * 100 + "%)" : "0";

  function barRow(r, max, color, dim) {
    r = rec(r);
    const ranked = r.rank != null && r.rank !== "";
    const row = el("div", "bar" + (dim ? " dim" : "")), label = el("div", "bar-l" + (ranked ? " ranked" : "")), line = el("div");
    if (ranked) line.append(el("span", "rk" + (Number(r.rank) === 1 ? " top" : ""), r.rank));
    if (r.dot) { const d = el("span", "dot"); d.style.background = r.dot; line.append(d); }
    line.append(el("span", "", r.label || "항목"));
    if (r.tag) line.append(tag(r.tag));
    label.append(line);
    if (r.sub) label.append(el("small", "", r.sub));
    const track = el("div", "track" + (isNum(r.value) ? "" : " na")), fill = el("div", "fill");
    fill.style.width = size(r.value, max);
    if (color) fill.style.background = color;
    track.append(fill);
    const value = el("div", "bar-v num" + (isNum(r.value) || r.display ? "" : " na"), shown(r.value, r.display));
    if (r.note) value.append(el("small", "", r.note));
    row.append(label, track, value);
    return row;
  }
  function bars(b) {
    b = rec(b);
    const rows = list(b.rows).map(rec), box = el("div", "panel");
    if (b.caption) box.append(el("p", "cap", b.caption));
    const grid = el("div", "bars"), max = maxOf(rows.map(r => r.value));
    const color = SERIES[b.series] ? SERIES[b.series][1] : "";
    const anyHighlight = rows.some(r => r.highlight);
    rows.forEach(r => grid.append(barRow(r, max, color, anyHighlight && !r.highlight)));
    box.append(grid);
    return box;
  }
  function prices(p) {
    p = rec(p);
    const items = list(p.items).map(rec), basis = rec(p.basis), frag = document.createDocumentFragment();
    const keys = Object.keys(SERIES).filter(k => items.some(it => k in it));
    const max = maxOf(items.flatMap(it => keys.map(k => rec(it[k]).value)));
    const legend = el("div", "legend");
    keys.forEach(k => {
      const lg = el("span", "lg"); lg.append(swatch(SERIES[k][1]), SERIES[k][0]);
      if (basis[k]) lg.append(el("small", "", basis[k]));
      legend.append(lg);
    });
    if (keys.length) frag.append(legend);
    items.forEach(it => {
      const card = el("article", "panel pcard"), top = el("div", "pcard-top");
      if (it.rank != null && it.rank !== "") top.append(el("div", "medal" + (Number(it.rank) === 1 ? " top" : ""), it.rank));
      const t = el("div", "pcard-t"), h = el("h3", "", it.name || "대상");
      if (it.badge) h.append(typeof it.badge === "object" ? tag(it.badge) : el("span", "badge info", it.badge));
      t.append(h);
      if (it.sub) t.append(el("p", "", it.sub));
      top.append(t);
      if (it.aside) {
        const a = el("div", "aside"), aside = rec(it.aside);
        a.append(el("small", "", aside.label), el("strong", "num", aside.value));
        top.append(a);
      }
      card.append(top);
      if (list(it.chips).length) card.append(chips(it.chips));
      if (it.band) card.append(el("p", "band", it.band));
      const grid = el("div", "bars");
      keys.filter(k => k in it).forEach(k => {
        const v = rec(it[k]);
        grid.append(barRow({label: SERIES[k][2], dot: SERIES[k][1],
          value: v.value, display: v.display, note: v.note}, max, SERIES[k][1]));
      });
      card.append(grid);
      if (it.note) card.append(el("p", "note", it.note));
      frag.append(card);
    });
    return frag;
  }
  function series(s) {
    s = rec(s);
    const rows = list(s.rows).map(rec), names = list(s.legend), box = el("div", "panel");
    const totals = rows.map(r => list(r.values).filter(isNum).reduce((a, v) => a + v, 0));
    const max = maxOf(totals), partial = rows.some(r => r.partial);
    const gaps = rows.map(r => list(r.values).some(isNum) && list(r.values).some(v => !isNum(v)));
    if (names.length > 1 || partial || gaps.includes(true)) {
      const legend = el("div", "legend");
      if (names.length > 1) names.forEach((n, i) => { const lg = el("span", "lg"); lg.append(swatch(RAMP[i % 4]), str(n)); legend.append(lg); });
      if (partial) { const lg = el("span", "lg"); lg.append(swatch("", "partial"), s.partialNote || "신고가 덜 쌓였을 수 있는 달"); legend.append(lg); }
      if (gaps.includes(true)) { const lg = el("span", "lg"); lg.append(el("b", "", "+"), " 일부 구분 확인 불가 · 합계는 최소값"); legend.append(lg); }
      box.append(legend);
    }
    const cols = el("div", "cols" + (rows.length > 18 ? " dense" : ""));
    rows.forEach((r, i) => {
      const values = list(r.values), known = values.some(isNum);
      const col = el("div", "col" + (r.partial ? " partial" : "")), plot = el("div", "plot");
      // 일부 구분이 비어 있으면 합계는 하한이다. display를 넣어도 +는 유지한다.
      const label = known ? shown(totals[i], r.display) + (gaps[i] ? "+" : "") : "—";
      const bar = el("div", "colbar"), stack = el("div", "stack");
      bar.style.height = known ? size(totals[i], max) : "0";
      bar.append(el("span", "col-v", label));
      values.forEach((v, j) => {
        if (!isNum(v) || v <= 0) return;
        const seg = el("div", "seg"); seg.style.height = v / totals[i] * 100 + "%"; seg.style.background = RAMP[j % 4];
        stack.append(seg);
      });
      bar.append(stack);
      plot.append(bar);
      col.title = str(r.label) + " " + (known ? label : NA);
      col.append(plot, el("span", "col-l", r.label));
      cols.append(col);
    });
    box.append(cols);
    return box;
  }
  function composition(c) {
    const box = el("div", "panel");
    list(rec(c).rows).map(rec).forEach(r => {
      const parts = list(r.parts).map(rec), sum = parts.filter(p => isNum(p.value)).reduce((a, p) => a + p.value, 0);
      // 한 항목이라도 비면 전체를 알 수 없으므로 비율과 막대를 그리지 않는다.
      const anyKnown = parts.some(p => isNum(p.value)), complete = anyKnown && parts.every(p => isNum(p.value));
      const total = !anyKnown ? NA : (complete ? "합계 " : "확인된 합계 ") + sum.toLocaleString("ko-KR") + (complete ? "" : " · 일부 확인 불가");
      const row = el("div", "comp"), head = el("div", "comp-h");
      head.append(el("span", "", r.label || "구성"), el("small", "num", total));
      const bar = el("div", "comp-bar" + (complete ? "" : " na")), values = el("div", "comp-v");
      parts.forEach((p, i) => {
        const share = complete && sum > 0 ? p.value / sum * 100 : 0;
        if (share > 0) { const seg = el("div", "seg"); seg.style.flex = "0 0 " + share + "%"; seg.style.background = RAMP[i % 4]; bar.append(seg); }
        const v = el("span", "num"); v.append(swatch(RAMP[i % 4]), str(p.label) + " ");
        v.append(el("b", "", shown(p.value, p.display)));
        if (share > 0) v.append(" · " + Math.round(share) + "%");
        values.append(v);
      });
      row.append(head, bar, values);
      box.append(row);
    });
    return box;
  }
  function kpis(items) {
    const grid = el("div", "kpis");
    list(items).map(rec).forEach(k => {
      const tile = el("div", "kpi"), v = el("div", "v num", shown(k.value));
      if (k.unit) v.append(el("small", "", k.unit));
      tile.append(el("div", "k", k.label), v);
      if (k.note) tile.append(el("div", "d", k.note));
      grid.append(tile);
    });
    return grid;
  }
  function chips(items) {
    const box = el("div", "chips");
    list(items).forEach(c => box.append(el("span", "chip", c)));
    return box;
  }
  function facts(items) {
    const dl = el("dl", "facts");
    list(items).map(rec).forEach(f => {
      const wrap = el("div", "fact"), dd = el("dd", "", shown(f.value));
      if (f.note) dd.append(el("small", "", f.note));
      wrap.append(el("dt", "", f.label), dd);
      dl.append(wrap);
    });
    return dl;
  }
  function table(t, title) {
    t = rec(t);
    const columns = list(t.columns), rows = list(t.rows);
    if (!rows.length) return el("p", "panel empty", t.emptyMessage || "표에 넣을 결과가 없습니다. 조회 범위와 결론을 함께 확인하세요.");
    const frame = el("div", "panel table-wrap"), tableEl = el("table");
    frame.tabIndex = 0; frame.setAttribute("role", "region"); frame.setAttribute("aria-label", t.caption || title || "표");
    if (t.caption) tableEl.append(el("caption", "", t.caption));
    const numeric = columns.map(c => rec(c).numeric === true);
    const head = el("tr");
    columns.forEach((c, i) => { const th = el("th", numeric[i] ? "r" : "", typeof c === "string" ? c : rec(c).label); th.scope = "col"; head.append(th); });
    const thead = el("thead"); thead.append(head);
    const tbody = el("tbody");
    rows.forEach(row => {
      const tr = el("tr");
      columns.forEach((_, i) => {
        const raw = list(row)[i], cell = rec(raw), value = raw !== null && typeof raw === "object" ? cell.value : raw;
        const td = el(i === 0 ? "th" : "td", numeric[i] ? "r" : "");
        if (i === 0) td.scope = "row";
        if (cell.status) td.append(badge(cell.status));
        rich(td, shown(value));
        if (cell.note) td.append(el("small", "", cell.note));
        tr.append(td);
      });
      tbody.append(tr);
    });
    tableEl.append(thead, tbody);
    frame.append(tableEl);
    return frame;
  }
  function items(list_) {
    const frag = document.createDocumentFragment();
    list(list_).map(rec).forEach(it => {
      const card = el("article", "panel item");
      if (it.kicker) card.append(el("p", "kicker", it.kicker));
      const head = el("div", "item-h");
      head.append(el("h3", "", it.name || "후보"));
      if (it.status) head.append(badge(it.status));
      card.append(head);
      if (it.summary) card.append(el("p", "", it.summary));
      if (list(it.chips).length) card.append(chips(it.chips));
      const checks = list(it.checks).map(rec);
      if (checks.length) {
        const ul = el("ul", "checks");
        checks.forEach(c => {
          const li = el("li", "check"), body = el("div");
          body.append(el("strong", "", c.label));
          if (c.value != null && c.value !== "") body.append(" ", el("span", "", c.value));
          if (c.note) body.append(el("small", "", c.note));
          li.append(badge(c.status), body);
          ul.append(li);
        });
        card.append(ul);
      }
      frag.append(card);
    });
    return frag;
  }
  function criteria(items_) {
    const box = el("div", "panel"), kinds = {required: "필수", preference: "선호", exclude: "제외"};
    list(items_).map(rec).forEach(c => {
      const row = el("div", "crit"), body = el("div");
      row.append(el("span", kinds[c.kind] ? c.kind : "", kinds[c.kind] || "조건"));
      body.append(el("strong", "", c.label));
      if (c.description) body.append(el("p", "", c.description));
      if (c.note) body.append(el("p", "", c.note));
      row.append(body);
      box.append(row);
    });
    return box;
  }
  function notes(items_) {
    const ul = el("ul", "notes");
    list(items_).forEach(n => ul.append(el("li", "", n)));
    return ul;
  }
  const BLOCKS = [["kpis", kpis], ["chips", chips], ["facts", f => { const b = el("div", "panel"); b.append(facts(f)); return b; }],
    ["prices", prices], ["bars", bars], ["series", series], ["composition", composition], ["criteria", criteria],
    ["items", items], ["table", table], ["notes", notes]];
  function section(s, n) {
    s = rec(s);
    const sec = el("section", "sec"), head = el("div", "sec-h");
    head.append(el("span", "n", String(n).padStart(2, "0")), el("h2", "", s.title || "세부 근거"));
    if (s.sub) head.append(el("span", "sub", s.sub));
    sec.append(head);
    if (s.intro) sec.append(el("p", "intro", s.intro));
    BLOCKS.forEach(([key, render]) => {
      const v = s[key];
      if (v == null || (Array.isArray(v) && !v.length)) return;
      sec.append(render(v, s.title));
    });
    if (s.note) sec.append(el("p", "note", s.note));
    return sec;
  }
  function page(dataId, opts) {
    const root = document.getElementById("report");
    let data;
    try {
      data = JSON.parse(document.getElementById(dataId).textContent);
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("invalid");
    } catch (_) {
      root.append(el("p", "panel fallback", "리포트 데이터를 읽을 수 없습니다. 파일을 다시 만들어 주세요. 조회 결과가 없다는 뜻은 아닙니다."));
      return;
    }
    document.title = data.title || opts.title;
    root.append(el("p", "eyebrow", data.eyebrow || opts.eyebrow), el("h1", "", data.title || opts.title));
    if (data.lede) root.append(el("p", "lede", data.lede));
    const v = rec(data.verdict), box = el("section", "verdict"), top = el("div", "verdict-top");
    top.append(el("span", "label", v.label || opts.verdictLabel));
    if (v.state === "partial" || v.state === "unavailable") top.append(badge(v.state));
    box.append(top, el("h2", "", v.headline || "아직 입력된 결과가 없습니다."));
    if (v.summary) box.append(el("p", "", v.summary));
    root.append(box);
    const sections = list(data.sections).concat((opts.extra || (() => []))(data)).map(rec);
    let n = 0;
    sections.forEach(s => root.append(section(s, ++n)));
    const sources = list(data.sources).map(rec);
    if (list(data.notes).length || sources.length || data.reference || data.generatedAt) {
      const hasNotes = list(data.notes).length > 0;
      const end = section({title: hasNotes ? data.notesTitle || opts.notesTitle : "데이터 출처와 기준시점", notes: data.notes}, ++n), foot = el("div", "foot");
      sources.forEach(src => {
        const p = el("p"); p.append(el("strong", "", src.name || "데이터 출처"));
        const detail = [src.reference, src.note].filter(Boolean).map(str).join(" · ");
        if (detail) p.append(" — " + detail);
        foot.append(p);
      });
      const meta = [data.reference, data.generatedAt && "작성 " + data.generatedAt].filter(Boolean).join("  |  ");
      if (meta) foot.append(el("p", "num", meta));
      if (foot.childNodes.length) end.append(foot);
      root.append(end);
    }
  }
  return {page};
})();
/* kit:end */
Kit.page("report-data", {eyebrow: "빅밸류 · 조건에 맞는 단지 찾기", title: "조건에 맞는 단지 찾기", verdictLabel: "찾은 결과",
  notesTitle: "해석할 때 함께 볼 점", extra: data => {
    const coverage = data.coverage || {}, extra = [];
    if (Array.isArray(data.criteria) && data.criteria.length) extra.push({title: "적용한 조건", criteria: data.criteria});
    if (coverage.summary || (Array.isArray(coverage.facts) && coverage.facts.length))
      extra.push({title: "알아둘 점", intro: coverage.summary, facts: coverage.facts});
    return extra;
  }});
</script>
</body>
</html>
