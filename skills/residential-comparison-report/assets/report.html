<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주거 비교 리포트</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#191f28;--sub:#596575;--faint:#66707d;
  --line:#e5e8eb;--accent:#3182f6;--accent-text:#205bc7;--accent-soft:#e8f1fe;
  --green:#0ca678;--violet:#7048e8;--orange:#b26a00;--shadow:0 8px 28px rgba(25,31,40,.06)
}
/* 다크 색상은 화면에만 적용하고, 인쇄는 기본 밝은 테마의 글자색을 유지한다. */
@media screen and (prefers-color-scheme:dark){
  :root{
    --bg:#0e1116;--card:#171b22;--ink:#edf0f3;--sub:#a3adb8;--faint:#7e8995;
    --line:#2a313a;--accent:#6ba6ff;--accent-text:var(--accent);--accent-soft:#1c2a40;
    --green:#3ecf9a;--violet:#a28af5;--orange:#e5b84b;--shadow:none
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,
  "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 56px}
.block[hidden]{display:none}
.hero{padding:10px 4px 18px}
.eyebrow{margin:0 0 5px;color:var(--accent-text);font-size:12px;font-weight:800;letter-spacing:.04em}
h1{margin:0;font-size:28px;line-height:1.3;letter-spacing:-.025em}
.scope{margin:8px 0 0;color:var(--sub);font-size:13px}
.subjects{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 14px}
.subject{min-width:140px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.subject-name{font-size:13px;font-weight:800}
.subject-note{display:block;margin-top:1px;color:var(--faint);font-size:11.5px}
.conclusion{padding:24px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow)}
.label{color:var(--sub);font-size:12px;font-weight:700}
.conclusion h2{margin:10px 0 6px;font-size:22px;line-height:1.45;letter-spacing:-.02em}
.conclusion p{margin:0;color:var(--sub)}
.highlights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.highlight{min-height:126px;padding:17px;border-radius:15px;background:var(--card);
  border:1px solid var(--line);border-top:3px solid var(--accent)}
.highlight.green{border-top-color:var(--green)}
.highlight.violet{border-top-color:var(--violet)}
.highlight.orange{border-top-color:var(--orange)}
.highlight-label{margin:0;color:var(--sub);font-size:12px;font-weight:700}
.highlight-value{margin:8px 0 3px;font-size:20px;font-weight:800;line-height:1.35;letter-spacing:-.02em}
.highlight-note{margin:0;color:var(--faint);font-size:12px}
.section{margin-top:14px;padding:22px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.section h2{margin:0 0 8px;font-size:17px;letter-spacing:-.015em}
.section-summary{margin:0 0 14px;color:var(--sub)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin:0}
.fact{padding:10px 0;border-top:1px solid var(--line)}
.fact dt{color:var(--faint);font-size:12px}
.fact dd{margin:2px 0 0;font-weight:700}
.fact small{display:block;margin-top:2px;color:var(--faint);font-size:11.5px;font-weight:400}
.table-wrap{overflow:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--faint);font-size:11.5px;
  font-weight:700;text-align:left}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
tbody tr:last-child td{border-bottom:0}
.foot{margin-top:22px;padding:0 4px}
.foot h2{margin:0 0 9px;font-size:13px}
.foot ul{margin:0;padding-left:18px;color:var(--sub);font-size:12.5px}
.foot li+li{margin-top:4px}
.sources{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.source{margin:4px 0;color:var(--faint);font-size:11.5px}
.meta{margin-top:12px;color:var(--faint);font-size:11px}
@media(max-width:720px){
  h1{font-size:23px}.highlights{grid-template-columns:1fr}.facts{grid-template-columns:1fr}
  .conclusion,.section{padding:18px}.conclusion h2{font-size:19px}.subject{flex:1 1 140px}
}
@media print{
  :root{--bg:#fff;--card:#fff}
  .wrap{max-width:none;padding:0}.conclusion,.section,.highlight{box-shadow:none}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <p class="eyebrow">주거 비교 리포트</p>
    <h1 id="title">비교 제목</h1>
    <p class="scope" id="scope"></p>
  </header>

  <section class="subjects block" id="subjects" aria-label="비교 대상"></section>

  <section class="conclusion">
    <span class="label" id="conclusionLabel">핵심 비교</span>
    <h2 id="headline"></h2>
    <p id="summary"></p>
  </section>

  <section class="highlights block" id="highlights" aria-label="비교 핵심 지표"></section>
  <div id="sections"></div>

  <footer class="foot">
    <section class="block" id="caveatBlock">
      <h2>해석할 때 함께 볼 점</h2>
      <ul id="caveats"></ul>
    </section>
    <section class="sources block" id="sourceBlock">
      <h2>데이터 출처</h2>
      <div id="sources"></div>
    </section>
    <p class="meta" id="meta"></p>
  </footer>
</main>

<!--
  이 JSON 블록에는 실제 조회 결과만 입력한다.
  subjects, highlights, sections는 비교 질문에 맞게 개수를 늘리거나 비울 수 있다.
  표와 순위는 sections.table의 columns와 rows로 표현한다.
  사용자 화면에는 API 필드명, slug, 내부 식별자, 인증 정보를 넣지 않는다.
-->
<script type="application/json" id="dm-comparison">
{
  "title": "",
  "scope": "",
  "reference": "",
  "generatedAt": "",
  "conclusion": {
    "label": "핵심 비교",
    "headline": "",
    "summary": ""
  },
  "subjects": [],
  "highlights": [],
  "sections": [],
  "caveats": [],
  "sources": []
}
</script>

<script>
(function(){
  "use strict";
  var data;
  try{data=JSON.parse(document.getElementById("dm-comparison").textContent)}
  catch(e){document.getElementById("headline").textContent="리포트 데이터를 읽을 수 없습니다.";return}

  function byId(id){return document.getElementById(id)}
  function setText(node,value){node.textContent=value==null?"":String(value)}
  function make(tag,className,text){
    var node=document.createElement(tag);
    if(className)node.className=className;
    if(text!=null)setText(node,text);
    return node
  }
  function hideWhenEmpty(node,items){node.hidden=!Array.isArray(items)||items.length===0}

  document.title=data.title||"주거 비교 리포트";
  setText(byId("title"),data.title||"주거 비교 리포트");
  setText(byId("scope"),data.scope||"");

  var subjects=Array.isArray(data.subjects)?data.subjects:[];
  var subjectRoot=byId("subjects");
  hideWhenEmpty(subjectRoot,subjects);
  subjects.forEach(function(item){
    var subject=make("article","subject");
    var name=typeof item==="string"?item:item&&item.name;
    var note=typeof item==="object"&&item?item.note:"";
    subject.appendChild(make("span","subject-name",name));
    if(note)subject.appendChild(make("span","subject-note",note));
    subjectRoot.appendChild(subject)
  });

  var conclusion=data.conclusion||{};
  setText(byId("conclusionLabel"),conclusion.label||"핵심 비교");
  setText(byId("headline"),conclusion.headline||"확인 가능한 비교 결과가 없습니다.");
  setText(byId("summary"),conclusion.summary||"");

  var highlights=Array.isArray(data.highlights)?data.highlights:[];
  var highlightRoot=byId("highlights");
  hideWhenEmpty(highlightRoot,highlights);
  highlights.forEach(function(item){
    var tones={green:"green",violet:"violet",orange:"orange"};
    var card=make("article","highlight "+(tones[item.tone]||""));
    card.appendChild(make("p","highlight-label",item.label));
    card.appendChild(make("p","highlight-value",item.value));
    if(item.note)card.appendChild(make("p","highlight-note",item.note));
    highlightRoot.appendChild(card)
  });

  var sections=Array.isArray(data.sections)?data.sections:[];
  var sectionRoot=byId("sections");
  sections.forEach(function(item){
    var section=make("section","section");
    section.appendChild(make("h2","",item.title||"세부 비교"));
    if(item.summary)section.appendChild(make("p","section-summary",item.summary));

    var facts=Array.isArray(item.facts)?item.facts:[];
    if(facts.length){
      var dl=make("dl","facts");
      facts.forEach(function(fact){
        var wrap=make("div","fact");
        wrap.appendChild(make("dt","",fact.label));
        var dd=make("dd","",fact.value);
        if(fact.note)dd.appendChild(make("small","",fact.note));
        wrap.appendChild(dd);dl.appendChild(wrap)
      });
      section.appendChild(dl)
    }

    var table=item.table||{},columns=Array.isArray(table.columns)?table.columns:[];
    var rows=Array.isArray(table.rows)?table.rows:[];
    if(columns.length&&rows.length){
      var tableWrap=make("div","table-wrap"),tableEl=make("table",""),thead=make("thead",""),tr=make("tr","");
      columns.forEach(function(column){tr.appendChild(make("th","",column))});
      thead.appendChild(tr);tableEl.appendChild(thead);
      var tbody=make("tbody","");
      rows.forEach(function(row){
        var bodyRow=make("tr","");
        columns.forEach(function(_,index){bodyRow.appendChild(make("td","",Array.isArray(row)?row[index]:""))});
        tbody.appendChild(bodyRow)
      });
      tableEl.appendChild(tbody);tableWrap.appendChild(tableEl);section.appendChild(tableWrap)
    }
    sectionRoot.appendChild(section)
  });

  var caveats=Array.isArray(data.caveats)?data.caveats:[];
  hideWhenEmpty(byId("caveatBlock"),caveats);
  caveats.forEach(function(item){byId("caveats").appendChild(make("li","",item))});

  var sources=Array.isArray(data.sources)?data.sources:[];
  hideWhenEmpty(byId("sourceBlock"),sources);
  sources.forEach(function(item){
    var text=[item.name,item.reference,item.note].filter(Boolean).join(" · ");
    byId("sources").appendChild(make("p","source",text))
  });
  setText(byId("meta"),[data.reference,data.generatedAt&&("작성 "+data.generatedAt)].filter(Boolean).join(" · "));
}());
</script>
</body>
</html>
